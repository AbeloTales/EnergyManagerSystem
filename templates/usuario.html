<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Energía - Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .card-prio { border-left: 5px solid; transition: transform 0.2s; }
        .card-prio:hover { transform: translateY(-3px); }
        .border-success { border-left-color: #28a745 !important; }
        .border-warning { border-left-color: #ffc107 !important; }
        .btn-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4 p-3 shadow">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">🏠 Mi Hogar Inteligente</span>
        <a href="/tecnico" class="btn btn-outline-light btn-sm">Ir a Configuración Técnica 🛠️</a>
    </div>
</nav>

<div class="container">
    
    <div class="row mb-4">
        <div class="col-md-5 mb-3 mb-md-0">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <h5 class="text-muted mb-3">💰 Presupuesto Mensual</h5>
                    
                    <div class="input-group mb-2 px-5">
                        <span class="input-group-text bg-white border-end-0">$</span>
                        <input type="number" id="inputSetPoint" class="form-control text-center fw-bold fs-4 border-start-0" 
                               onchange="guardarSetPoint()" placeholder="20.00">
                    </div>
                    <small class="text-muted d-block mb-4">Define tu límite máximo de gasto.</small>
                    
                    <div class="bg-light p-3 rounded border mx-3">
                        <h6 class="text-muted small text-uppercase ls-1">Proyección de Costo</h6>
                        <h2 class="fw-bold text-primary mb-2" id="prediccion-usd">--</h2>
                        <span id="estado-presupuesto" class="badge bg-secondary">Calculando...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-muted">📊 Historial de Consumo (Barras)</h5>
                    <canvas id="chartBarras" height="180"></canvas>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mb-3 text-muted border-bottom pb-2">Estado de Circuitos</h4>
    <div class="row" id="grid-grupos">
        <div class="col-12 text-center text-muted">Cargando sistema...</div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>

<script>
    const ctx = document.getElementById('chartBarras').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: { 
            labels: [], 
            datasets: [{ 
                label: 'Consumo (kWh)', 
                data: [], 
                backgroundColor: 'rgba(13, 110, 253, 0.7)',
                borderColor: 'rgba(13, 110, 253, 1)',
                borderWidth: 1,
                borderRadius: 4
            }] 
        },
        options: { 
            responsive: true, 
            scales: { y: { beginAtZero: true } },
            plugins: { legend: { display: false } }
        }
    });

    async function actualizar() {
        try {
            const res = await fetch('/api/datos');
            const data = await res.json();
            
            if(document.activeElement.id !== 'inputSetPoint') {
                document.getElementById('inputSetPoint').value = data.config.set_point_dinero;
            }

            const costo = data.stats.pred_usd;
            const alerta = data.estado_alerta; 
            
            document.getElementById('prediccion-usd').innerText = `$ ${costo.toFixed(2)}`;
            const badge = document.getElementById('estado-presupuesto');
            
            if (alerta === 'critico') {
                badge.className = 'badge bg-danger'; badge.innerText = "🚨 Presupuesto Excedido - CORTE ACTIVO";
            } else if (alerta === 'advertencia') {
                badge.className = 'badge bg-warning text-dark'; badge.innerText = "⚠️ Cerca del límite";
            } else {
                badge.className = 'badge bg-success'; badge.innerText = "✅ Dentro del límite";
            }

            const datosGrafico = data.grafico.slice(0, 15);
            chart.data.labels = datosGrafico.map(x => x[0].split(' ')[1].substring(0,5));
            chart.data.datasets[0].data = datosGrafico.map(x => x[1]);
            chart.update('none');

            const div = document.getElementById('grid-grupos');
            div.innerHTML = '';
            
            data.grupos.forEach(g => {
                if(g.id === 0) return; 
                
                const esPrioritario = g.prioridad === 1;
                const claseBorde = esPrioritario ? 'border-success' : 'border-warning';
                const textoBadge = esPrioritario ? 'Alta Prioridad (Esencial)' : 'Baja Prioridad (Apagable)';
                const claseBadge = esPrioritario ? 'bg-success' : 'bg-warning text-dark';
                
                const relesDelGrupo = data.reles.filter(r => r.id_grupo === g.id);
                const todosApagados = relesDelGrupo.every(r => r.estado === 0);
                
                let listaHtml = '<ul class="list-group list-group-flush small mt-2">';
                if (relesDelGrupo.length === 0) listaHtml += '<li class="list-group-item text-muted fst-italic">Sin dispositivos</li>';
                else {
                    relesDelGrupo.forEach(r => {
                        const estadoIcon = r.estado ? '🟢' : '⚪';
                        listaHtml += `<li class="list-group-item bg-transparent px-0 py-1">${estadoIcon} ${r.nombre}</li>`;
                    });
                }
                listaHtml += '</ul>';

                let btnRehabilitar = '';
                // Botón aparece si: Estamos en CRITICO + Grupo es BAJA PRIORIDAD + Está APAGADO
                if (alerta === 'critico' && !esPrioritario && todosApagados) {
                    btnRehabilitar = `
                    <div class="mt-3 border-top pt-2">
                        <small class="text-danger d-block mb-1 fw-bold">⛔ Corte por Presupuesto</small>
                        <button onclick="reactivarGrupo(${g.id}, '${g.nombre}')" class="btn btn-outline-danger btn-sm w-100 btn-pulse">
                            🔓 Rehabilitar (Temporal)
                        </button>
                    </div>`;
                }

                div.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="card card-prio ${claseBorde} h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="fw-bold mb-1">${g.nombre}</h5>
                            <div><span class="badge ${claseBadge}">${textoBadge}</span></div>
                            ${listaHtml}
                            <div class="mt-auto">${btnRehabilitar}</div>
                        </div>
                    </div>
                </div>`;
            });

        } catch (e) { console.error(e); }
    }

    async function reactivarGrupo(id, nombre) {
        if(!confirm(`⚠️ ¿Deseas encender '${nombre}'?\n\nADVERTENCIA: Estás sobre el presupuesto. El sistema podría volver a apagarlo automáticamente en el próximo ciclo de revisión.`)) return;

        await fetch('/api/usuario_reactivar', {
            method: 'POST', 
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ id_grupo: id, nombre: nombre })
        });
        
        alert("✅ Circuito Reactivado (Se envió notificación a Telegram).");
        actualizar();
    }

    async function guardarSetPoint() {
        const val = parseFloat(document.getElementById('inputSetPoint').value);
        if (isNaN(val) || val < 0) return alert("Ingrese un valor válido");

        await fetch('/api/guardar_config', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ set_point: val })
        });
        actualizar();
    }

    setInterval(actualizar, 2000);
    actualizar();
</script>
</body>
</html>
