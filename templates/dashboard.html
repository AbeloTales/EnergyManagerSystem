<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', system-ui, sans-serif; }
        .prediccion-card { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .prioridad-alta { border-left: 5px solid #28a745; }
        .prioridad-baja { border-left: 5px solid #ffc107; }
        .nombre-editable:hover { text-decoration: underline; background-color: #f8f9fa; border-radius: 5px; }
        .badge-ciclo { background-color: #6610f2; color: white; }
        .badge-horario { background-color: #0dcaf0; color: black; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 p-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">⚡ Sistema Inteligente</span>
        <div class="text-white small me-3 d-none d-md-block">
            Hora Sistema: <span id="hora-sistema" class="fw-bold text-warning">--:--:--</span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-danger btn-sm" onclick="controlGlobal(0)">🛑 APAGAR TODO</button>
            <button class="btn btn-success btn-sm" onclick="controlGlobal(1)">⚡ ENCENDER TODO</button>
            <button class="btn btn-outline-light btn-sm" onclick="abrirModalCrear()">+ Nuevo Grupo</button>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
            <div class="card prediccion-card h-100 text-center py-3">
                <div class="card-body d-flex flex-column justify-content-center">
                    <h5 class="opacity-75 mb-0">Predicción Mensual</h5>
                    
                    <h1 class="display-4 fw-bold mt-2 mb-0" id="prediccion-val">--</h1>
                    <p class="small opacity-75 mb-3">kWh estimados</p>
                    
                    <div class="bg-white bg-opacity-25 rounded p-2 mx-4">
                        <small class="d-block text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px;">Costo Aprox.</small>
                        <h2 class="fw-bold m-0" id="prediccion-costo">-- USD</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title mb-0">Consumo Real (Delta)</h5>
                        <span id="tendencia-txt" class="small">--</span>
                    </div>
                    <canvas id="graficoEnergia" height="100"></canvas>
                </div>
            </div>
        </div>
    </div>

    <h5 class="text-muted border-bottom pb-2 mb-3">📂 Zonas Inteligentes</h5>
    <div class="row mb-4" id="contenedor-grupos">
        <div class="col-12 text-center text-muted py-3">Cargando...</div>
    </div>

    <h5 class="text-muted border-bottom pb-2 mb-3">🔌 Control Individual</h5>
    <div class="row mb-4" id="contenedor-reles"></div>

    <div class="card">
        <div class="card-header bg-white fw-bold">📜 Historial de Lecturas</div>
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                <table class="table table-hover mb-0 text-center small">
                    <thead class="table-light"><tr><th>Hora</th><th>Medidor</th><th>Consumo</th></tr></thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div class="modal fade" id="modalGrupo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Configurar Zona</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="idGrupoEditar" value=""> 
                
                <div class="mb-3">
                    <label class="form-label">Nombre del Grupo</label>
                    <input type="text" id="nombreGrupo" class="form-control" placeholder="Ej: Luces Exterior">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Prioridad</label>
                    <select id="prioridadGrupo" class="form-select">
                        <option value="1">🟢 Alta (Nunca apagar auto)</option>
                        <option value="0">🟡 Baja (Apagar por consumo)</option>
                    </select>
                </div>

                <hr>
                <label class="form-label fw-bold">Modo de Automatización:</label>
                
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="checkHorario" onchange="toggleModos('horario')">
                    <label class="form-check-label">📅 Horario Fijo</label>
                </div>
                <div id="box-horario" class="d-none bg-light p-2 rounded mb-3 border">
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="small">Encender (HH:MM):</label>
                            <input type="time" id="horaInicio" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="small">Apagar (HH:MM):</label>
                            <input type="time" id="horaFin" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="checkCiclo" onchange="toggleModos('ciclo')">
                    <label class="form-check-label">⏱️ Modo Cíclico (Intervalos)</label>
                </div>
                <div id="box-ciclo" class="d-none bg-light p-2 rounded mb-3 border">
                    <p class="small text-muted mb-2">Encender y apagar repetidamente.</p>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="small">Minutos ON:</label>
                            <input type="number" id="cicloOn" class="form-control" value="10" min="1">
                        </div>
                        <div class="col-6">
                            <label class="small">Minutos OFF:</label>
                            <input type="number" id="cicloOff" class="form-control" value="10" min="1">
                        </div>
                    </div>
                </div>
                <hr>

                <label class="form-label">Dispositivos:</label>
                <div id="lista-reles-modal" class="list-group"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" onclick="guardarGrupo()">Guardar Cambios</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>

<script>
    const ctx = document.getElementById('graficoEnergia').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Consumo', data: [], borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,0.1)', fill: true, tension: 0.4 }] },
        options: { responsive: true, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
    });
    
    const modalElement = new bootstrap.Modal(document.getElementById('modalGrupo'));
    let relesGlobales = []; 
    let gruposGlobales = [];

    async function actualizar() {
        try {
            const res = await fetch('/api/datos');
            const data = await res.json();
            
            relesGlobales = data.reles;
            gruposGlobales = data.grupos;

            document.getElementById('hora-sistema').innerText = data.hora_servidor;

            // Gráfico y Textos
            chart.data.labels = data.grafico.map(x => x[0].split(' ')[1].substring(0,5));
            chart.data.datasets[0].data = data.grafico.map(x => x[1]);
            chart.update('none');
            
            document.getElementById('prediccion-val').innerText = data.estadisticas.prediccion.toFixed(2);
            document.getElementById('prediccion-costo').innerText = "$ " + data.estadisticas.costo.toFixed(2);
            document.getElementById('tendencia-txt').innerText = data.estadisticas.tendencia;

            // Grupos
            const divG = document.getElementById('contenedor-grupos');
            divG.innerHTML = '';
            data.grupos.forEach(g => {
                if(g.id === 0) return; 
                const badgePrio = g.prioridad===1 
                    ? '<span class="badge bg-success mb-2">Prio Alta</span>' 
                    : '<span class="badge bg-warning text-dark mb-2">Prio Baja</span>';
                
                let badgeAuto = "";
                if(g.modo_ciclo === 1) {
                    badgeAuto = `<span class="badge badge-ciclo">⏱️ ${g.ciclo_on}m ON / ${g.ciclo_off}m OFF</span>`;
                } else if (g.usar_horario === 1) {
                    badgeAuto = `<span class="badge badge-horario">📅 ${g.hora_inicio} - ${g.hora_fin}</span>`;
                }

                divG.innerHTML += `
                <div class="col-md-6 mb-3">
                    <div class="card shadow-sm h-100 ${g.prioridad===1?'prioridad-alta':'prioridad-baja'}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="fw-bold">${g.nombre}</h5>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${g.id})">✏️</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarGrupo(${g.id})">🗑️</button>
                                </div>
                            </div>
                            <div class="mb-3">${badgePrio} ${badgeAuto}</div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-success flex-fill" onclick="controlGrupo(${g.id}, 1)">ON</button>
                                <button class="btn btn-secondary flex-fill" onclick="controlGrupo(${g.id}, 0)">OFF</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            // Relés
            const divR = document.getElementById('contenedor-reles');
            const listM = document.getElementById('lista-reles-modal');
            const modalAbierto = document.getElementById('modalGrupo').classList.contains('show');

            divR.innerHTML = ''; 
            if (!modalAbierto) listM.innerHTML = '';

            data.reles.forEach(r => {
                divR.innerHTML += `
                <div class="col-6 col-md-3 mb-3">
                    <div class="card h-100 shadow-sm border-${r.estado?'success':'light'}">
                        <div class="card-body p-2 text-center">
                            <div class="text-primary fw-bold text-truncate mb-2 nombre-editable" 
                                 onclick="editarNombre(${r.id}, '${r.nombre}')" style="cursor: pointer;">✏️ ${r.nombre}</div>
                            <div class="small text-muted mb-2">Pin ${r.pin_gpio}</div>
                            <button onclick="toggle(${r.id})" class="btn w-100 btn-sm ${r.estado?'btn-success':'btn-outline-secondary'}">
                                ${r.estado?'ENCENDIDO':'APAGADO'}
                            </button>
                        </div>
                    </div>
                </div>`;

                if (!modalAbierto) {
                    listM.innerHTML += `
                    <label class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${r.nombre}</span>
                        <input class="form-check-input checkbox-rele" type="checkbox" value="${r.id}" id="check-rele-${r.id}">
                    </label>`;
                }
            });

            // Historial
            const tbody = document.getElementById('tabla-historial');
            tbody.innerHTML = '';
            data.historial.forEach(h => {
                tbody.innerHTML += `<tr><td>${h.fecha.split(' ')[1].substring(0,8)}</td><td>${h.valor_kwh}</td><td>${h.consumo_delta.toFixed(4)}</td></tr>`;
            });

        } catch (e) { console.error(e); }
    }

    // --- LÓGICA DE MODALES ---
    
    function toggleModos(modoActivo) {
        const boxHorario = document.getElementById('box-horario');
        const boxCiclo = document.getElementById('box-ciclo');
        const chkHorario = document.getElementById('checkHorario');
        const chkCiclo = document.getElementById('checkCiclo');

        if(modoActivo === 'horario' && chkHorario.checked) chkCiclo.checked = false; 
        else if (modoActivo === 'ciclo' && chkCiclo.checked) chkHorario.checked = false;

        boxHorario.classList.toggle('d-none', !chkHorario.checked);
        boxCiclo.classList.toggle('d-none', !chkCiclo.checked);
    }

    function abrirModalCrear() {
        document.getElementById('tituloModal').innerText = "Crear Nuevo Grupo";
        document.getElementById('idGrupoEditar').value = ""; 
        document.getElementById('nombreGrupo').value = "";
        document.getElementById('prioridadGrupo').value = "1";
        
        document.getElementById('checkHorario').checked = false;
        document.getElementById('checkCiclo').checked = false;
        toggleModos('ninguno');
        
        document.getElementById('horaInicio').value = "";
        document.getElementById('horaFin').value = "";
        document.getElementById('cicloOn').value = "10";
        document.getElementById('cicloOff').value = "10";
        
        document.querySelectorAll('.checkbox-rele').forEach(c => c.checked = false);
        modalElement.show();
    }

    function abrirModalEditar(idGrupo) {
        const g = gruposGlobales.find(x => x.id === idGrupo);
        if(!g) return;

        document.getElementById('tituloModal').innerText = "Editar: " + g.nombre;
        document.getElementById('idGrupoEditar').value = idGrupo; 
        document.getElementById('nombreGrupo').value = g.nombre;
        document.getElementById('prioridadGrupo').value = g.prioridad;
        
        // Horario
        document.getElementById('checkHorario').checked = (g.usar_horario === 1);
        document.getElementById('horaInicio').value = g.hora_inicio;
        document.getElementById('horaFin').value = g.hora_fin;

        // Ciclo
        document.getElementById('checkCiclo').checked = (g.modo_ciclo === 1);
        document.getElementById('cicloOn').value = g.ciclo_on || 10;
        document.getElementById('cicloOff').value = g.ciclo_off || 10;
        
        toggleModos('ninguno'); // Refrescar cajas

        // Reles
        document.querySelectorAll('.checkbox-rele').forEach(c => c.checked = false); 
        relesGlobales.forEach(r => {
            if (r.id_grupo === idGrupo) {
                const chk = document.getElementById(`check-rele-${r.id}`);
                if(chk) chk.checked = true;
            }
        });

        modalElement.show();
    }

    async function guardarGrupo() {
        const idEdicion = document.getElementById('idGrupoEditar').value;
        const nombre = document.getElementById('nombreGrupo').value;
        const ids = [...document.querySelectorAll('#lista-reles-modal input:checked')].map(cb => parseInt(cb.value));
        
        if(!nombre || ids.length === 0) return alert("Falta nombre o dispositivos");

        const payload = {
            accion: idEdicion ? 'editar_grupo' : 'crear_grupo',
            id: idEdicion ? idEdicion : null,
            nombre: nombre,
            prioridad: document.getElementById('prioridadGrupo').value,
            usar_horario: document.getElementById('checkHorario').checked ? 1 : 0,
            hora_inicio: document.getElementById('horaInicio').value,
            hora_fin: document.getElementById('horaFin').value,
            modo_ciclo: document.getElementById('checkCiclo').checked ? 1 : 0,
            ciclo_on: document.getElementById('cicloOn').value,
            ciclo_off: document.getElementById('cicloOff').value,
            reles: ids
        };

        await enviarApi(payload);
        modalElement.hide();
        actualizar();
    }

    // --- UTILS ---
    async function toggle(id) { await enviarApi({accion: 'toggle', id: id}); }
    async function editarNombre(id, nombreActual) {
        let nuevo = prompt("Nuevo nombre:", nombreActual);
        if (nuevo && nuevo !== nombreActual) {
            await enviarApi({accion: 'editar_nombre', id: id, nombre: nuevo});
            actualizar();
        }
    }
    async function controlGlobal(estado) { if(confirm("¿Seguro?")) await enviarApi({accion: 'global', estado: estado}); }
    async function controlGrupo(gid, estado) { await enviarApi({accion: 'grupo', id_grupo: gid, estado: estado}); }
    async function eliminarGrupo(gid) { if(confirm("¿Eliminar?")) await enviarApi({accion: 'eliminar_grupo', id_grupo: gid}); }
    
    async function enviarApi(data) {
        await fetch('/api/control', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
        });
        actualizar();
    }

    setInterval(actualizar, 2000);
    actualizar();
</script>
</body>
</html>
