<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .prediccion-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .tendencia-up { color: #dc3545; font-weight: bold; }
        .tendencia-down { color: #28a745; font-weight: bold; }
        .prioridad-alta { border-left: 5px solid #28a745; }
        .prioridad-baja { border-left: 5px solid #ffc107; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">🧠 Sistema Inteligente de Energía</span>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalGrupo">+ Crear Grupo Inteligente</button>
    </div>
</nav>

<div class="container">

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card prediccion-box h-100">
                <div class="card-body text-center">
                    <h5>🔮 Predicción de Consumo</h5>
                    <h2 id="prediccion-valor">-- kWh</h2>
                    <p class="small opacity-75">Proyección basada en últimos 10 datos</p>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h5 class="card-title">Consumo en Tiempo Real (Delta)</h5>
                        <span id="alerta-tendencia">--</span>
                    </div>
                    <canvas id="graficoEnergia" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <h5 class="text-muted">📂 Gestión de Zonas</h5>
    <div class="row mb-4" id="contenedor-grupos"></div>

    <h5 class="text-muted">🔌 Dispositivos</h5>
    <div class="row mb-4" id="contenedor-reles"></div>

    <div class="card">
        <div class="card-header bg-white">📜 Historial de Lecturas (Últimas 50)</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0 text-center">
                    <thead><tr><th>ID</th><th>Hora</th><th>Lectura Medidor</th><th>Consumo Real</th></tr></thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalGrupo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Configurar Grupo</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>Nombre:</label>
                    <input type="text" id="nombreGrupo" class="form-control" placeholder="Ej: Luces Patio">
                </div>
                
                <div class="mb-3">
                    <label>Prioridad:</label>
                    <select id="prioridadGrupo" class="form-select">
                        <option value="1">Alta (Siempre encendido)</option>
                        <option value="0">Baja (Apagar si hay consumo alto)</option>
                    </select>
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="checkHorario" onchange="toggleHorario()">
                    <label class="form-check-label">Activar Control por Horario</label>
                </div>

                <div id="box-horario" class="d-none bg-light p-2 rounded mb-3">
                    <div class="row">
                        <div class="col-6">
                            <label class="small">Encender a las:</label>
                            <input type="time" id="horaInicio" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="small">Apagar a las:</label>
                            <input type="time" id="horaFin" class="form-control">
                        </div>
                    </div>
                </div>

                <label>Dispositivos:</label>
                <div id="lista-reles-modal" class="list-group"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="guardarGrupo()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>
<script>
    const ctx = document.getElementById('graficoEnergia').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Consumo (kWh)', data: [], borderColor: '#007bff', tension: 0.4, fill: true }] },
        options: { scales: { y: { beginAtZero: true } } }
    });

    function toggleHorario() {
        document.getElementById('box-horario').classList.toggle('d-none');
    }

    async function actualizar() {
        const res = await fetch('/api/datos');
        const data = await res.json();

        // 1. Gráfico y Predicción
        chart.data.labels = data.grafico.map(x => x[0].split(' ')[1]); // Solo hora
        chart.data.datasets[0].data = data.grafico.map(x => x[1]);
        chart.update('none');

        document.getElementById('prediccion-valor').innerText = data.estadisticas.prediccion.toFixed(2) + " kWh";
        const tend = document.getElementById('alerta-tendencia');
        tend.innerText = "Tendencia: " + data.estadisticas.tendencia;
        tend.className = data.estadisticas.tendencia === 'Subiendo' ? 'tendencia-up' : 'tendencia-down';

        // 2. Grupos
        const divG = document.getElementById('contenedor-grupos');
        divG.innerHTML = '';
        data.grupos.forEach(g => {
            if(g.id === 0) return;
            const tipo = g.prioridad === 1 ? '<span class="badge bg-success">Prioritario</span>' : '<span class="badge bg-warning text-dark">Baja Prioridad</span>';
            const horarioInfo = g.usar_horario ? `<small class="d-block text-muted">🕒 ${g.hora_inicio} - ${g.hora_fin}</small>` : '';
            
            divG.innerHTML += `
            <div class="col-md-6 mb-3">
                <div class="card ${g.prioridad===1?'prioridad-alta':'prioridad-baja'} shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5>${g.nombre}</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarGrupo(${g.id})">×</button>
                        </div>
                        ${tipo} ${horarioInfo}
                    </div>
                </div>
            </div>`;
        });

        // 3. Reles (Modal y Vista)
        const divR = document.getElementById('contenedor-reles');
        const listM = document.getElementById('lista-reles-modal');
        divR.innerHTML = ''; listM.innerHTML = '';

        data.reles.forEach(r => {
            // Vista Dashboard
            divR.innerHTML += `
            <div class="col-6 col-md-3 mb-2">
                <button class="btn w-100 ${r.estado?'btn-success':'btn-outline-secondary'}" onclick="toggle(${r.id})">
                    ${r.nombre} <br> <small>${r.estado?'ON':'OFF'}</small>
                </button>
            </div>`;
            
            // Lista Modal
            listM.innerHTML += `
            <label class="list-group-item">
                <input class="form-check-input me-2" type="checkbox" value="${r.id}"> ${r.nombre}
            </label>`;
        });

        // 4. Historial
        const tbody = document.getElementById('tabla-historial');
        tbody.innerHTML = '';
        data.historial.forEach(h => {
            tbody.innerHTML += `<tr>
                <td>${h.id}</td>
                <td>${h.fecha}</td>
                <td>${h.valor_kwh}</td>
                <td class="fw-bold">${h.consumo_delta.toFixed(4)}</td>
            </tr>`;
        });
    }

    async function toggle(id) {
        await fetch('/api/control', { 
            method: 'POST', 
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({accion:'toggle', id:id})
        });
        actualizar();
    }

    async function eliminarGrupo(id) {
        if(confirm("¿Eliminar grupo?")) {
            await fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({accion:'eliminar_grupo', id_grupo:id})
            });
            actualizar();
        }
    }

    async function guardarGrupo() {
        const ids = [...document.querySelectorAll('#lista-reles-modal input:checked')].map(cb => parseInt(cb.value));
        if(ids.length === 0) return alert("Selecciona dispositivos");

        const data = {
            accion: 'crear_grupo',
            nombre: document.getElementById('nombreGrupo').value,
            prioridad: document.getElementById('prioridadGrupo').value,
            usar_horario: document.getElementById('checkHorario').checked ? 1 : 0,
            hora_inicio: document.getElementById('horaInicio').value,
            hora_fin: document.getElementById('horaFin').value,
            reles: ids
        };

        await fetch('/api/control', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalGrupo'));
        modal.hide();
        actualizar();
    }

    setInterval(actualizar, 2000);
    actualizar();
</script>
</body>
</html>
